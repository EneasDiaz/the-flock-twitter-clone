services:
  db:
    image: postgres:16
    container_name: twitter_clone_db
    environment:
      POSTGRES_DB: twitter_clone
      POSTGRES_USER: twitter_clone
      POSTGRES_PASSWORD: twitter_clone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: twitter_clone_web
    command: python app/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  postgres_data: